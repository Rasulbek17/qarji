<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қаржы есебі</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7785;--ln:#e3e8ee;--in:#1f9d55;--ex:#d64545;--ac:#2563eb;--bar:#e8edf3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#19212a;--tx:#e8edf2;--mut:#93a0ad;--ln:#2a3541;--in:#3ecf7a;--ex:#ff6b6b;--ac:#6ea0ff;--bar:#26313c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--card:#19212a;--tx:#e8edf2;--mut:#93a0ad;--ln:#2a3541;--in:#3ecf7a;--ex:#ff6b6b;--ac:#6ea0ff;--bar:#26313c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
.w{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:14px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:19px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px}
.chips button{padding:5px 10px;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
input,select{font:inherit;padding:9px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);min-width:0}
input.n{flex:1 1 90px}input.t{flex:2 1 120px}select{flex:1 1 110px}
.it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--ln);gap:8px}
.it small{color:var(--mut);display:block}
.it span.a{white-space:nowrap;font-weight:600}
.it button{padding:2px 8px;color:var(--mut)}
.in{color:var(--in)}.ex{color:var(--ex)}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;border-top:2px solid var(--ln)}
.bal{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bal div{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}
.br{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.br .l{width:105px;flex:none}
.br .b{flex:1;height:12px;background:var(--bar);border-radius:6px;overflow:hidden}
.br .b i{display:block;height:100%;background:var(--ex)}
.br .v{width:96px;text-align:right;flex:none;font-size:13px}
.tip{background:var(--bg);border-left:4px solid var(--ac);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:14.5px}
.tip.w2{border-color:var(--ex)}.tip.ok{border-color:var(--in)}
.yr{display:flex;align-items:flex-end;gap:4px;height:150px;margin:8px 0 4px}
.yr div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer}
.yr .p{display:flex;align-items:flex-end;gap:2px;width:100%;height:100%}
.yr .p i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.yr span{font-size:10px;color:var(--mut);margin-top:3px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:5px 6px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
td:first-child,th:first-child{text-align:left}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="w">
<h1>💰 Қаржы есебі</h1>
<div class="mut" style="margin:-8px 0 12px">By_Rasul</div>
<div class="card">
  <div class="nav"><button id="pv">◀</button><b id="ttl"></b><button id="nx">▶</button></div>
  <div class="chips" id="chips"></div>
</div>
<div class="card">
  <h2 class="in">➕ Кіріс (табыс)</h2>
  <div class="row"><input class="t" id="it" placeholder="Қайдан (жалақы, ...)"><input class="n" id="ia" type="number" inputmode="decimal" placeholder="Сома"><button class="p" id="ib">Қосу</button></div>
  <div id="il"></div><div class="tot"><span>Жалпы кіріс</span><span class="in" id="ti"></span></div>
</div>
<div class="card">
  <h2 class="ex">➖ Шығыс</h2>
  <div class="row"><input class="t" id="et" placeholder="Не үшін (нан, бензин, ...)"><select id="ec"></select><input class="n" id="ea" type="number" inputmode="decimal" placeholder="Сома"><button class="p" id="eb">Қосу</button></div>
  <div id="el"></div><div class="tot"><span>Жалпы шығыс</span><span class="ex" id="te"></span></div>
</div>
<div class="card"><h2>📊 Осы айдың талдауы</h2><div id="ma"></div></div>
<div class="card"><h2>📅 12 айлық талдау</h2><div id="ya"></div></div>
<p class="mut">Деректер осы құрылғыда (браузерде) сақталады. Келесі айға өтсеңіз, алдыңғы ай жойылмайды.</p>
</div>
<div class="bal"><div><span>Қалды:</span><span id="bl"></span></div></div>
<script>
var MN=['Қаңтар','Ақпан','Наурыз','Сәуір','Мамыр','Маусым','Шілде','Тамыз','Қыркүйек','Қазан','Қараша','Желтоқсан'];
var CT=['Тамақ','Көлік','Үй / коммуналдық','Киім','Денсаулық','Көңіл көтеру','Байланыс','Басқа'];
var S={},mem=null;
try{S=JSON.parse(localStorage.getItem('qarji')||'{}')}catch(e){S=mem||{}}
function save(){mem=S;try{localStorage.setItem('qarji',JSON.stringify(S))}catch(e){}}
var now=new Date(),Y=now.getFullYear(),M=now.getMonth();
var $=function(i){return document.getElementById(i)};
function K(y,m){return y+'-'+(m+1)}
function D(y,m){return S[K(y,m)]||{inc:[],exp:[]}}
function cur(){var k=K(Y,M);if(!S[k])S[k]={inc:[],exp:[]};return S[k]}
function f(n){return Math.round(n).toLocaleString('ru-RU')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sum(a){return a.reduce(function(s,x){return s+x.a},0)}
function cats(d){var o={};d.exp.forEach(function(x){o[x.c]=(o[x.c]||0)+x.a});return Object.keys(o).map(function(k){return[k,o[k]]}).sort(function(a,b){return b[1]-a[1]})}
$('ec').innerHTML=CT.map(function(c){return'<option>'+c+'</option>'}).join('');
$('pv').onclick=function(){M--;if(M<0){M=11;Y--}render()};
$('nx').onclick=function(){M++;if(M>11){M=0;Y++}render()};
function add(type){
  var p=type=='i'?'i':'e',t=$(p+'t').value.trim(),a=parseFloat($(p+'a').value);
  if(!(a>0))return;
  var o={t:t||(type=='i'?'Кіріс':'Шығыс'),a:a};
  if(type=='e')o.c=$('ec').value;
  cur()[type=='i'?'inc':'exp'].push(o);
  $(p+'t').value='';$(p+'a').value='';save();render();
}
$('ib').onclick=function(){add('i')};$('eb').onclick=function(){add('e')};
function del(type,i){cur()[type].splice(i,1);save();render()}
function list(arr,type,cls){
  return arr.map(function(x,i){return'<div class="it"><div>'+esc(x.t)+(x.c?'<small>'+esc(x.c)+'</small>':'')+'</div><span class="a '+cls+'">'+f(x.a)+'</span><button onclick="del(\''+type+'\','+i+')">✕</button></div>'}).join('')||'<div class="mut">Бос</div>';
}
function bars(c,tot){
  var mx=c.length?c[0][1]:1;
  return c.map(function(x){return'<div class="br"><span class="l">'+esc(x[0])+'</span><span class="b"><i style="width:'+(x[1]/mx*100)+'%"></i></span><span class="v">'+f(x[1])+' ('+Math.round(x[1]/tot*100)+'%)</span></div>'}).join('');
}
function monthAn(){
  var d=D(Y,M),I=sum(d.inc),E=sum(d.exp),h='';
  if(!d.exp.length)return'<div class="mut">Шығыс енгізгеннен кейін талдау көрінеді.</div>';
  var c=cats(d);h+=bars(c,E);
  h+='<div class="tip w2">🔎 Ақша ең көп <b>'+esc(c[0][0])+'</b> бөліміне кетті: '+f(c[0][1])+' ('+Math.round(c[0][1]/E*100)+'%).</div>';
  var big=d.exp.slice().sort(function(a,b){return b.a-a.a})[0];
  h+='<div class="tip">💸 Ең үлкен бір шығын: <b>'+esc(big.t)+'</b> — '+f(big.a)+'.</div>';
  var small=d.exp.filter(function(x){return x.a<E*0.05}),ss=sum(small);
  if(small.length>=5)h+='<div class="tip w2">🧩 '+small.length+' ұсақ шығын жиналып '+f(ss)+' болды ('+Math.round(ss/E*100)+'%). Ұсақ шығындар байқалмай кетеді.</div>';
  if(I>0){var r=E/I*100;
    h+='<div class="tip '+(r>100?'w2':r>80?'w2':'ok')+'">'+(r>100?'⚠️ Шығыс кірістен көп: '+f(E-I)+' артық кетті.':r>80?'⚠️ Кірістің '+Math.round(r)+'% шығын болды, жинау қиын.':'✅ Кірістің '+Math.round(r)+'% шығын, '+f(I-E)+' қалды.')+'</div>';}
  var py=M?Y:Y-1,pm=M?M-1:11,pd=D(py,pm);
  if(pd.exp.length){var pe=sum(pd.exp),pc={};cats(pd).forEach(function(x){pc[x[0]]=x[1]});
    var df=c.map(function(x){return[x[0],x[1]-(pc[x[0]]||0)]}).sort(function(a,b){return b[1]-a[1]})[0];
    h+='<div class="tip">📈 Өткен айға қарағанда шығыс '+(E>=pe?'<b>'+f(E-pe)+' артық</b>':'<b>'+f(pe-E)+' кем</b>')+'.'+(df[1]>0?' Ең көп өскені: <b>'+esc(df[0])+'</b> (+'+f(df[1])+').':'')+'</div>';}
  return h;
}
function yearAn(){
  var rows=[],mx=1,TI=0,TE=0,all={},act=0;
  for(var m=0;m<12;m++){var d=D(Y,m),i=sum(d.inc),e=sum(d.exp);rows.push({m:m,i:i,e:e});mx=Math.max(mx,i,e);TI+=i;TE+=e;if(i||e)act++;
    d.exp.forEach(function(x){all[x.c]=(all[x.c]||0)+x.a})}
  var h='<div class="mut">'+Y+' жыл (жасыл = кіріс, қызыл = шығыс). Айды басыңыз.</div><div class="yr">';
  rows.forEach(function(r){h+='<div onclick="M='+r.m+';render();window.scrollTo(0,0)"><div class="p"><i style="height:'+(r.i/mx*100)+'%;background:var(--in)"></i><i style="height:'+(r.e/mx*100)+'%;background:var(--ex)"></i></div><span>'+MN[r.m].slice(0,3)+'</span></div>'});
  h+='</div><div class="sc"><table><tr><th>Ай</th><th>Кіріс</th><th>Шығыс</th><th>Қалды</th></tr>';
  rows.forEach(function(r){h+='<tr><td>'+MN[r.m]+'</td><td class="in">'+f(r.i)+'</td><td class="ex">'+f(r.e)+'</td><td>'+f(r.i-r.e)+'</td></tr>'});
  h+='<tr><th>Барлығы</th><th class="in">'+f(TI)+'</th><th class="ex">'+f(TE)+'</th><th>'+f(TI-TE)+'</th></tr></table></div>';
  if(!TE)return h;
  var c=Object.keys(all).map(function(k){return[k,all[k]]}).sort(function(a,b){return b[1]-a[1]});
  h+='<h2 style="margin-top:14px">Жыл бойы ақша қайда кетті</h2>'+bars(c,TE);
  var wm=rows.filter(function(r){return r.e}).sort(function(a,b){return b.e-a.e})[0];
  h+='<div class="tip w2">🔥 Ең көп шығын: <b>'+MN[wm.m]+'</b> ('+f(wm.e)+'). Ең көп кеткен бөлім: <b>'+esc(c[0][0])+'</b> ('+Math.round(c[0][1]/TE*100)+'%).</div>';
  if(act>0)h+='<div class="tip">📆 Орта есеппен айына '+f(TE/act)+' шығын, '+f(TI/act)+' кіріс.</div>';
  if(TI>0)h+='<div class="tip '+(TI>=TE?'ok':'w2')+'">'+(TI>=TE?'✅ Жылына '+f(TI-TE)+' жиналды ('+Math.round((TI-TE)/TI*100)+'%).':'⚠️ Жыл бойы '+f(TE-TI)+' артық шығын.')+'</div>';
  return h;
}
function render(){
  var d=cur();
  $('ttl').textContent=MN[M]+' '+Y;
  $('chips').innerHTML=MN.map(function(n,i){return'<button class="'+(i==M?'on':'')+'" onclick="M='+i+';render()">'+n.slice(0,3)+'</button>'}).join('');
  $('il').innerHTML=list(d.inc,'inc','in');$('el').innerHTML=list(d.exp,'exp','ex');
  var I=sum(d.inc),E=sum(d.exp);
  $('ti').textContent=f(I);$('te').textContent=f(E);
  var b=$('bl');b.textContent=f(I-E);b.style.color=I-E<0?'var(--ex)':'var(--in)';
  $('ma').innerHTML=monthAn();$('ya').innerHTML=yearAn();
}
render();
</script>
</body>
</html>
